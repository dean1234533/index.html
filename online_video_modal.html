<style>
.vid-thumb{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:4/5;text-decoration:none;background:var(--card);cursor:pointer;max-width:360px;margin-inline:auto}
.vid-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .4s,filter .4s;filter:brightness(.75)}
.vid-thumb:hover img,.vid-thumb:focus-visible img{transform:scale(1.04);filter:brightness(.55)}
.vid-thumb:focus-visible{outline:2px solid var(--seo-accent,#b30018);outline-offset:3px}
.vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.vid-play svg{width:64px;height:64px;background:rgba(179,0,24,.85);border-radius:50%;padding:16px;transition:transform .25s,background .25s;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.vid-thumb:hover .vid-play svg{transform:scale(1.1);background:#b30018}
.vid-label{position:absolute;bottom:0;left:0;right:0;padding:20px 20px 22px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);z-index:2;text-align:center}
.vid-label span{color:#fff;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.vid-label span::after{content:'↗';font-size:.9rem}
#vidModal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.96);align-items:center;justify-content:center}
#vidModal.open{display:flex}
#vidClose{position:fixed;top:16px;right:16px;width:44px;height:44px;background:rgba(255,255,255,.12);border:none;border-radius:50%;color:#fff;font-size:1.3rem;cursor:pointer;z-index:10001;display:flex;align-items:center;justify-content:center;transition:background .2s}
#vidClose:hover{background:rgba(255,255,255,.25)}
#vidWrap{position:relative;width:min(380px,92vw);background:#000;border-radius:16px;overflow:hidden;box-shadow:0 32px 96px rgba(0,0,0,.9)}
#vidPlayer{width:100%;display:block;max-height:85vh;object-fit:contain}
</style>
<div id="vidModal" onclick="closeVid()">
  <button id="vidClose" onclick="closeVid()" aria-label="Close video">✕</button>
  <div id="vidWrap" onclick="event.stopPropagation()">
    <video id="vidPlayer" controls playsinline></video>
  </div>
</div>
<script>
  function openVid(src){
    var v=document.getElementById('vidPlayer');
    v.src=src;
    v.load();
    v.play();
    document.getElementById('vidModal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeVid(){
    var v=document.getElementById('vidPlayer');
    v.pause();
    v.removeAttribute('src');
    v.load();
    document.getElementById('vidModal').classList.remove('open');
    document.body.style.overflow='';
  }
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeVid();});
</script>
